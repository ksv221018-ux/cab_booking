<!DOCTYPE html>

<html>

<head>

    <title>Fare Details</title>

</head>

<body>

    <h2>Ride Details</h2>

    <p>
        <strong>Pickup:</strong>
        {{ pickup }}
    </p>

    <p>
        <strong>Drop:</strong>
        {{ drop }}
    </p>

    <p>
        <strong>Distance:</strong>
        {{ distance }} km
    </p>

    <p>
        <strong>Fare:</strong>
        ₹{{ fare }}
    </p>


    <form method="POST">

        {% csrf_token %}

        <input type="hidden"
               name="pickup"
               value="{{ pickup }}">

        <input type="hidden"
               name="drop"
               value="{{ drop }}">

        <input type="hidden"
               name="fare"
               value="{{ fare }}">
        
        <input type="hidden"
               name="distance"
               value="{{ distance }}">

        <button type="submit" name="book">
            Book Ride
        </button>

    </form>

</body>

</html>
